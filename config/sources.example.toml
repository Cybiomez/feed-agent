# Источники новостей. Скопировать в sources.toml и править.
# Типы (адаптеры): "rss" (лента RSS/Atom) и "telegram" (публичный канал через t.me/s/).
# name — метка в дайджесте; url — адрес ленты или канал (@name / t.me/name / https://t.me/name).

# --- Telegram-каналы (публичные) ---
# [[source]]
# type = "telegram"
# name = "Просто DevOps"
# url  = "https://t.me/имя_канала"     # или @имя_канала

# --- RSS-ленты ---

[[source]]
type = "rss"
name = "Hacker News (front)"
url  = "https://hnrss.org/frontpage"

[[source]]
type = "rss"
name = "Ars Technica"
url  = "https://feeds.arstechnica.com/arstechnica/index"

[[source]]
type = "rss"
name = "The Verge"
url  = "https://www.theverge.com/rss/index.xml"
