# Настройки фид-агента. Скопировать в settings.toml и править под себя.
# settings.toml в git не попадает (см. .gitignore).

[run]
# Максимум новостей, которые берём в оценку за один прогон (защита от лимитов/стоимости).
max_items_per_run = 60
# Сколько дней держим историю в базе (для дедупликации и «уже виденного").
history_days = 14

[filter]
# Порог отбора 0..100. Новость проходит, если оценка >= threshold.
# Смещение в полноту: держим НИЗКИМ, лучше пропустить лишнее, чем потерять нужное.
threshold = 45
# Сколько пунктов максимум в одном дайджесте (чтобы не заваливать).
digest_max_items = 12

[model]
# Сменный провайдер оценки. Варианты: "openrouter" (дефолт) | "stub" (офлайн-заглушка).
provider = "openrouter"
# Имя модели у провайдера. Держим в конфиге — бесплатные модели у OpenRouter меняются.
model = "qwen/qwen-2.5-72b-instruct:free"
# Сколько заголовков отправляем модели в одном запросе (пачкой — дешевле и быстрее).
batch_size = 20
# Таймаут запроса к модели, сек.
timeout_s = 40
# Имя переменной окружения с ключом провайдера (сам ключ — вне репозитория).
api_key_env = "OPENROUTER_API_KEY"
# База API (OpenAI-совместимая). Для OpenRouter — вот эта.
api_base = "https://openrouter.ai/api/v1"

[delivery]
# Команда шва notify (доставка в Telegram). Меняется, если notify лежит иначе.
notify_cmd = "notify"
# Заголовок дайджеста.
title = "🗞️ Дайджест новостей"
