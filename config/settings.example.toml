# Настройки фид-агента. Скопировать в settings.toml и править под себя.
# settings.toml в git не попадает (см. .gitignore).

[run]
# Сколько дней держим историю в базе (дедупликация и «уже виденное»).
history_days = 14
# Размер пула для фильтра релевантности (крупно — цель «все новости», а не «топ-N»).
prefilter_pool = 200
# Предохранитель: макс. групп-новостей за прогон (остаток уйдёт следующим, не теряется).
enrich_per_run = 40
# Окно сверки (часы): не повторять новость, показанную за это время (repeat — пропуск, update — 🔄).
freshness_hours = 30

[filter]
# Новостей в одном сообщении дайджеста (страница); остальное — следующими сообщениями.
digest_max_items = 8

[summarizer]
# Кто делает русскую выжимку:
#   "claude"     — локальный claude CLI (без ключа, через подписку)
#   "openrouter" — бесплатная модель QWEN через OpenRouter (нужен бесплатный ключ)
#   "stub"       — офлайн-заглушка (без модели)
provider = "openrouter"
# Модель. Для claude: пусто = по умолчанию. Для openrouter — id модели (бесплатные — с ":free").
model = "qwen/qwen-2.5-72b-instruct:free"
# Таймаут одного вызова модели, сек.
timeout_s = 60
# Только для openrouter: база API и имя переменной окружения с ключом (сам ключ вне репозитория).
api_base = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[delivery]
# Команда шва notify (доставка в Telegram).
notify_cmd = "notify"
# Заголовок дайджеста.
title = "🗞️ Дайджест новостей"
# Разовый адрес получателя (notify --to): своя тема, а не тред алертов.
# id чата (напр. -100...) и тема форума. Пусто = адрес по умолчанию notify.
target_chat = ""
target_thread = ""
