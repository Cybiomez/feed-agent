# Настройки фид-агента. Скопировать в settings.toml и править под себя.
# settings.toml в git не попадает (см. .gitignore).

[run]
# Сколько дней держим историю в базе (дедупликация и «уже виденное»).
history_days = 14
# Сколько новостей за прогон обогащаем русской выжимкой (полный текст + Claude).
# Это дорогая часть — берём топ N свежих, а не весь поток.
enrich_per_run = 10

[filter]
# Сколько пунктов максимум в одном сообщении дайджеста (лимит Telegram ~4096 символов).
digest_max_items = 8

[summarizer]
# Кто делает русскую выжимку: "claude" (локальный claude CLI, без ключа) | "stub" (офлайн).
provider = "claude"
# Модель claude CLI: пусто = по умолчанию.
model = ""
# Таймаут одного вызова Claude, сек.
timeout_s = 120

[delivery]
# Команда шва notify (доставка в Telegram).
notify_cmd = "notify"
# Заголовок дайджеста.
title = "🗞️ Дайджест новостей"
# Разовый адрес получателя (notify --to): своя тема, а не тред алертов.
# id чата (напр. -100...) и тема форума. Пусто = адрес по умолчанию notify.
target_chat = ""
target_thread = ""
